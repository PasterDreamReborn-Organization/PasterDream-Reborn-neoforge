modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="原作 / Original: 异星之尘 (Aerolite_Dust)"
description='''帕斯特之梦: 重生 — PD社区重制版，经原作者授权。
Community remake of PasterDream, authorized by the original author.

§n致谢 / Acknowledgments:§r
§l原作:§r 异星之尘 (Aerolite_Dust)
§l策划:§r 拭柳喑雨 (ShiLiuYinYu)
