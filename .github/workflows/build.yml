name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate data
        run: ./gradlew runData

      - name: Check generated resources exist
        shell: bash
        run: |
          test -s src/generated/resources/assets/pasterdream/lang/zh_cn.json
          test -s src/generated/resources/data/pasterdream/recipe/titanium_upgrade.json

      - name: Build and run server GameTests
        run: ./gradlew build runGameTestServer
